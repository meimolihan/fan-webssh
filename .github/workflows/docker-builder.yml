name: Build Server to DockerHub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (leave empty for default latest)'
        required: false
        default: 'latest'

concurrency:
  group: dockerhub-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 仅构建 server 正式版；跳过 native-* / client* 的 Release，避免误构建并覆盖 latest 镜像
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-') && !startsWith(github.event.release.tag_name, 'client'))
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          meimolihan/fan-webssh:${{ github.event.release.tag_name || inputs.tag_name }}
          meimolihan/fan-webssh:latest